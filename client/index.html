<!DOCTYPE html>
<html lang="en" class="dark" style="background-color: #0b0d0e; color: #e4e4e7;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resonix — High-Fidelity Music Streaming Server & Audio Vault</title>
    <meta name="description" content="Self-hosted audiophile personal music streaming server with Web Audio DSP, 60fps canvas visualizers, and OpenSubsonic API compatibility" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Resonix" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      html, body {
        background-color: #06090e !important;
        color: #e4e4e7 !important;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background-color: #06090e;
      }
      #root:empty::before {
        content: "Loading Resonix...";
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        color: #71717a;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body class="bg-charcoal-950 text-zinc-100 overflow-hidden" style="background-color: #06090e; color: #e4e4e7;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Self-heal on chunk loading failures caused by stale app-shell caches.
      // Never delete offline audio caches and never enter a reload loop.
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var recoveryKey = 'resonix-last-asset-recovery';
          var lastRecovery = Number(sessionStorage.getItem(recoveryKey) || 0);
          if (Date.now() - lastRecovery < 15000) {
            console.warn('[Resonix] Asset failed to load again; skipping cache reset to avoid a reload loop.');
            return;
          }
          sessionStorage.setItem(recoveryKey, String(Date.now()));
          console.warn('[Resonix] Asset failed to load. Clearing app-shell caches only...');
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) {
                return k.indexOf('audio-cache-') === 0 ? Promise.resolve(false) : caches.delete(k);
              }));
            }).then(function() {
              window.location.reload();
            });
          }
        }
      }, true);

      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update().catch(() => {});
          }).catch(console.warn);
        });
      }
    </script>
  </body>
</html>
