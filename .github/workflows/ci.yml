name: Resonix CI / CD Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-test:
    name: Unit & Integration Tests (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Node Dependencies
        run: npm ci

      - name: Generate Prisma Client & Run DB Migrations
        run: |
          npm run db:generate
          npm run db:migrate

      - name: Execute Full Test Suite
        run: npm test

      - name: Build Production Client & Server
        run: npm run build

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: audit-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: resonix:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fresh Volume Migration & Readiness Smoke Test
        run: |
          docker volume create resonix-ci-data
          docker run -d --name resonix-ci \
            -p 3999:3000 \
            -v resonix-ci-data:/data \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e CREDENTIAL_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e DEPLOYMENT_PROFILE=PERSONAL \
            resonix:test

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3999/api/ready; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "Container failed to become ready"
            docker logs resonix-ci
            exit 1
          fi

          curl -fsS http://127.0.0.1:3999/api/auth/status

          # Restart on the same volume to prove migrations are idempotent and backups run
          docker rm -f resonix-ci
          docker run -d --name resonix-ci \
            -p 3999:3000 \
            -v resonix-ci-data:/data \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e CREDENTIAL_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e DEPLOYMENT_PROFILE=PERSONAL \
            resonix:test

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3999/api/ready; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "Container failed to become ready after restart"
            docker logs resonix-ci
            exit 1
          fi
          docker exec resonix-ci sh -c 'ls /data/backups/library-*.db | head -n 1'

          docker rm -f resonix-ci
          docker volume rm resonix-ci-data
