# ==============================================================================
# Resonix - Enterprise Docker Compose Orchestration
# Turnkey self-hosted audiophile streaming server
# ==============================================================================

version: '3.8'

services:
  resonix:
    image: ghcr.io/angki/resonix:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resonix
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      # Required: generate with `node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"`
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      - DATABASE_URL=file:/data/library.db
      - LIBRARY_ROOTS_JSON=["/music"]
      - PLAYLIST_IMPORT_PATH=/data/playlists
      - DEPLOYMENT_PROFILE=${DEPLOYMENT_PROFILE:-PERSONAL}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - BACKUP_RETENTION=${BACKUP_RETENTION:-7}
      # Optional: Last.fm Scrobbler Integration
      # - LASTFM_API_KEY=your_api_key
      # - LASTFM_API_SECRET=your_api_secret
      # Optional: Discogs Artist Metadata & HD Artwork
      # - DISCOGS_CONSUMER_KEY=your_discogs_key
      # - DISCOGS_CONSUMER_SECRET=your_discogs_secret
    volumes:
      # Mount your audio directories strictly READ-ONLY for absolute file protection
      - /path/to/your/music:/music:ro
      # Persistent application state (SQLite database, cached artwork, scrobble queues)
      - resonix-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  resonix-data:
    name: resonix-data
